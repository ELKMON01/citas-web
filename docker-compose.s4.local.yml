services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the root .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in the root .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env}
      TZ: America/Bogota
    volumes:
      - s4_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./citas-api:/workspace
      - s4_maven_cache:/root/.m2
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the root .env}
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in the root .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the root .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the root .env}
      FRONTEND_ORIGIN: http://localhost:5174
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_SAME_SITE: Lax
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["bash", "-lc", "mvn spring-boot:run -Dspring-boot.run.profiles=local"]

  web:
    image: node:24-alpine
    working_dir: /workspace
    volumes:
      - ./citas-web:/workspace
      - s4_node_modules:/workspace/node_modules
      - s4_npm_cache:/root/.npm
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "5174:5173"
    command: ["sh", "-lc", "npm ci && npm run dev -- --host 0.0.0.0"]

volumes:
  s4_mysql_data:
  s4_maven_cache:
  s4_node_modules:
  s4_npm_cache:
